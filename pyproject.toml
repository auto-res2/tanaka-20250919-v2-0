[project]
name = "proa-jsp-research"
version = "0.1.0"
description = "Implementation of Progressive Anchor-Aware Jensen-Shannon Preservation (ProA-JSP) for LLM fine-tuning."
authors = [{ name = "AI Researcher", email = "researcher@example.com" }]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.35.0",
    "peft>=0.6.3",
    "bitsandbytes>=0.41.0",
    "captum>=0.7.0",
    "datasets>=2.15.0",
    "evaluate>=0.4.0",
    "sacrebleu>=2.4.0",
    "rouge-score>=0.1.2",
    "accelerate>=0.23.0",
    "torchmetrics>=1.2.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.26.0",
    "PyYAML>=6.0",
    "matplotlib>=3.7.0"
]

[tool.setuptools]
packages = ["src"]
