experiment_name: "full_exp_sst2_proa_jsp"
output_dir: ".research/iteration1/full_experiment"
model:
  name: "NousResearch/Llama-2-7b-hf"
  load_in_8bit: true
  device_map: "auto"
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
task:
  name: "glue"
  subset: "sst2"
  text_column: "sentence"
  label_column: "label"
  max_length: 256
training:
  seeds: [12, 23, 34]
  epochs: 3
  learning_rate: 2.0e-4
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 2
  weight_decay: 0.0
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  bf16: true
proa_jsp:
  enabled: true
  lambda: 1.0
  k_anchor: 128
  percentile: 90
evaluation:
  per_device_eval_batch_size: 8
  datasets:
    - name: "wikitext"
      subset: "wikitext-103-raw-v1"
      split: "validation"
      text_column: "text"
      max_samples: 1000
    - name: "truthful_qa"
      subset: "multiple_choice"
      split: "validation"
    - name: "pubmed_qa"
      subset: "pqa_labeled"
      split: "train"
      max_samples: 1000
